# =============================================================================
# HOST CONFIGURATION - UEFI Boot Example
# =============================================================================
#
# This is an example configuration for a system using UEFI boot.
# Copy this file and customize it for your system.
#
# Location: config/hosts/<hostname>.conf or /etc/kvm-borg/hosts/<hostname>.conf
#
# =============================================================================

# System identification
SYSTEM_NAME="example-uefi"
SYSTEM_DESC="Example UEFI server"

# Boot mode: "bios" or "uefi"
BOOT_MODE="uefi"

# LVM Volume Group name
# This should match the VG name used during OS installation
VG_NAME="almalinux"

# -----------------------------------------------------------------------------
# Partition Sizes
# -----------------------------------------------------------------------------
# Use standard size notation: M for megabytes, G for gigabytes
# Leave HOME_SIZE empty to use all remaining space

# EFI System Partition (required for UEFI boot)
# Typically 200-600MB is sufficient
EFI_SIZE="600M"

# Boot partition (/boot) - contains kernel and initramfs
# UEFI systems can have larger boot partitions
BOOT_SIZE="2G"

# Root partition (/) - main OS filesystem
ROOT_SIZE="80G"

# Swap partition
SWAP_SIZE="4G"

# Home partition (/home)
# Set a specific size or leave empty for remaining space
HOME_SIZE="40G"

# -----------------------------------------------------------------------------
# Post-Restore Notes
# -----------------------------------------------------------------------------
# These notes are displayed after a successful restore.
# Use this to remind yourself of system-specific tasks.

POST_RESTORE_NOTES="
  - UEFI boot entry should be automatically created
  - If boot fails, use UEFI shell or run: efibootmgr --create ...
  - Check Secure Boot settings in BIOS if having boot issues
  - ZFS pools (if any) may need: zpool import -a
"
