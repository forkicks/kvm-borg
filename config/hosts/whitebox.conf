# Post-restore notes
POST_RESTORE_NOTES="
  - Update /etc/fstab UUIDs for:
      /mnt/cache_filesystem (NVMe cache, ext4, ~1.8TB)
      /backup (XFS, ~7.3TB)
      /virtualmachines3 (NVMe, ext4, ~3.6TB)
  - Data disks (Data01-Data59) are mounted by manual_mounts.sh using UUIDs
  - Run: /root/scripts/manual_mounts.sh to mount data disks
"
