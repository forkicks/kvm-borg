# =============================================================================
# HOST CONFIGURATION - backup (Backup Server)
# =============================================================================

SYSTEM_NAME="backup"
SYSTEM_DESC="Backup server"
BOOT_MODE="uefi"

# LVM Volume Group name
VG_NAME="almalinux"

# Partition sizes
EFI_SIZE="600M"
BOOT_SIZE="2G"
ROOT_SIZE="73G"
SWAP_SIZE="4G"
HOME_SIZE="40G"      # Fixed size, not remaining

# Post-restore notes
POST_RESTORE_NOTES="
  - ZFS pools (pool4tb, pool8tb) will import automatically if disks are present
  - Run: zpool import -a (if pools don't auto-import)
  - CIFS mount to production server configured in fstab
"
