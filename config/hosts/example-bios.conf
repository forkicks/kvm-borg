# =============================================================================
# HOST CONFIGURATION - BIOS/Legacy Boot Example
# =============================================================================
#
# This is an example configuration for a system using BIOS/Legacy boot.
# Copy this file and customize it for your system.
#
# Location: config/hosts/<hostname>.conf or /etc/kvm-borg/hosts/<hostname>.conf
#
# =============================================================================

# System identification
SYSTEM_NAME="example-bios"
SYSTEM_DESC="Example BIOS server"

# Boot mode: "bios" or "uefi"
BOOT_MODE="bios"

# LVM Volume Group name
# This should match the VG name used during OS installation
VG_NAME="almalinux"

# -----------------------------------------------------------------------------
# Partition Sizes
# -----------------------------------------------------------------------------
# Use standard size notation: M for megabytes, G for gigabytes
# Leave HOME_SIZE empty to use all remaining space

# EFI partition (only used for UEFI boot mode)
EFI_SIZE=""

# Boot partition (/boot) - contains kernel and initramfs
BOOT_SIZE="1G"

# Root partition (/) - main OS filesystem
ROOT_SIZE="100G"

# Swap partition
SWAP_SIZE="4G"

# Home partition (/home) - leave empty for remaining space
HOME_SIZE=""

# -----------------------------------------------------------------------------
# Post-Restore Notes
# -----------------------------------------------------------------------------
# These notes are displayed after a successful restore.
# Use this to remind yourself of system-specific tasks.

POST_RESTORE_NOTES="
  - Check /etc/fstab for any additional mount points
  - Verify network configuration in /etc/NetworkManager/
  - If this server has additional data disks, mount them manually
"
