# =============================================================================
# KVM-BORG BACKUP CONFIGURATION
# =============================================================================
# Generated from existing scripts on whitebox
# =============================================================================

# -----------------------------------------------------------------------------
# BORG REPOSITORY PATHS
# -----------------------------------------------------------------------------

# Local Borg repository for system backups
BORG_REPO_SYSTEM="/backup/system"

# Local Borg repository for VM backups
BORG_REPO_VMS="/backup/kvm"

# Remote backup settings
REMOTE_HOST="192.168.0.207"
REMOTE_BORG_REPO_SYSTEM="ssh://192.168.0.207/pool8tb/datasets/borgrepo"
REMOTE_BORG_REPO_VMS="ssh://192.168.0.207/pool8tb/datasets/kvmrepo"

# -----------------------------------------------------------------------------
# BORG SETTINGS
# -----------------------------------------------------------------------------

# Borg passphrase - set via environment or BORG_PASSCOMMAND for security
# export BORG_PASSCOMMAND="cat /root/.borg-passphrase"
BORG_PASSPHRASE=""

# Path to borg binary (leave empty to auto-detect)
BORG_BINARY="/usr/local/bin/borg"

# Compression algorithm
BORG_COMPRESSION_SYSTEM="lz4"
BORG_COMPRESSION_VMS="zstd,5"

# Prune settings - how many backups to keep
BORG_PRUNE_KEEP="--keep-daily 7 --keep-weekly 4 --keep-monthly 12"

# SSH optimization for Borg transfers
BORG_RSH="ssh -c aes128-gcm@openssh.com -o Compression=no -x"

# Encryption method for new repositories
BORG_ENCRYPTION_METHOD="repokey-blake2"

# -----------------------------------------------------------------------------
# REMOTE BACKUP STATE TRACKING
# -----------------------------------------------------------------------------

REMOTE_STATE_DIR="/var/lib/backup-state"
REMOTE_STALE_DAYS=14

# -----------------------------------------------------------------------------
# VM BACKUP SETTINGS
# -----------------------------------------------------------------------------

BACKUP_TMP_DIR="/tmp/kvm_backup"

# VMs to exclude from backup
VM_EXCLUDE_LIST=("backup" "brain")

# -----------------------------------------------------------------------------
# SYSTEM BACKUP - SERVICE MANAGEMENT
# -----------------------------------------------------------------------------

# Systemd services (containers) to stop before backup and restart after
CONTAINERS=(
    "radarr"
    "sonarr"
    "plex"
    "mariadb"
    "gitea"
    "calibre"
    "ubooquity"
    "portainer"
    "prowlarr"
    "tautulli"
    "jackett"
    "tdarr"
    "meilisearch"
    "threadfin"
    "youtube-dl"
    "homepage"
    "kitana"
    "flaresolverr"
    "squid"
    "delugevpn"
    "streamdvr"
)

# Services that need a delayed start (30 seconds) after other services
CONTAINERS_DELAYED_START=("mediascraper" "jellyfin")

# Pre-backup command (database dump)
PRE_BACKUP_COMMAND="/usr/local/bin/backup-database.sh"

# Service that must remain running for pre-backup command
# Gitea is stopped first, then database backup runs, then mariadb stops
PRE_BACKUP_SERVICE="mariadb"

# -----------------------------------------------------------------------------
# SYSTEM BACKUP - EXCLUDES
# -----------------------------------------------------------------------------

# Standard system paths to exclude
SYSTEM_EXCLUDES=(
    "/mnt"
    "/proc"
    "/sys"
    "/dev"
    "/run"
    "/tmp"
    "/var/tmp"
    "/var/run"
    "/var/cache"
    "/backup"
)

# Custom excludes specific to this system
CUSTOM_EXCLUDES=(
    # VM disk images (backed up separately by backup-vms.sh)
    "/virtualmachines3/brain"
    "/virtualmachines3/leonardo"
    "/virtualmachines3/rfx3d"
    "/virtualmachines3/thebutler"
    "/virtualmachines3/whitebox"
    "/virtualmachines3/whitebox4"
    "/virtualmachines3/whitebox5"

    # Logs
    "/var/log/messages"
    "/var/log/borgbackup.log"

    # Docker container data - large/transient
    "/virtualmachines3/docker/streamdvr/streamdvr/captured"
    "/virtualmachines3/docker/streamdvr/streamdvr/capturing"
    "/virtualmachines3/docker/delugevpn/delugevpn/completed"
    "/virtualmachines3/docker/delugevpn/delugevpn/incomplete"
    "/virtualmachines3/docker/calibre/calibre/library"
    "/virtualmachines3/docker/squid/cache"
    "/virtualmachines3/docker/jellyfin/jellyfin/cache"
    "/virtualmachines3/docker/ubooquity/ubooquity/cache"
    "/virtualmachines3/docker/containers/cache"

    # Docker logs
    "/virtualmachines3/docker/*/logs"
    "/virtualmachines3/docker/*/*/logs"

    # Thinclient drives
    "/root/thinclient_drives"
    "/*/thinclient_drives"

    # Kernel build directory
    "/home/kernel"

    # Samba transient lock/state files (recreated on startup)
    "/var/lib/samba/lock"
)

# -----------------------------------------------------------------------------
# DATABASE BACKUP SETTINGS
# -----------------------------------------------------------------------------

# Database type: "mysql", "mariadb", "postgresql"
DB_TYPE="mariadb"

# Database connection - reads from Gitea config or set manually
DB_HOST="127.0.0.1"
DB_PORT=""
DB_USER="gitea"
DB_NAME="gitea"

# Path to file containing database password
# Create with: grep PASSWD /virtualmachines3/docker/gitea/gitea/gitea/conf/app.ini | awk -F'`' '{print $2}' > /root/.gitea-db-password
DB_PASSWORD_FILE="/root/.gitea-db-password"

# Backup storage
DB_BACKUP_DIR="/backup/gitea"
DB_BACKUP_PREFIX="gitea-db-backup"
DB_BACKUP_KEEP=3

# Remote sync for database backups
DB_REMOTE_HOST="192.168.0.207"
DB_REMOTE_BACKUP_DIR="/pool8tb/datasets/gitea-backup"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

LOG_FILE_SYSTEM="/var/log/backup-system.log"
LOG_FILE_VMS="/var/log/backup-vms.log"
LOG_FILE_DATABASE="/var/log/gitea-backup.log"

# -----------------------------------------------------------------------------
# LOCK FILES
# -----------------------------------------------------------------------------

LOCK_FILE_SYSTEM="/var/run/backup-system.lock"
LOCK_FILE_VMS="/var/run/backup-vms.lock"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
